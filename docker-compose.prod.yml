services:
  # 1. Redis (Cache internal)
  redis:
    image: redis:7-alpine
    container_name: hrd_redis
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # 2. Backend Fastify (Production - Connect to Shared Postgres)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: hrd_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password_vps_utama_123@global_postgres:5432/hrd_analytics_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your_secure_jwt_secret_key_production}
    depends_on:
      - redis
    networks:
      - default
      - global_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 3. Frontend Nginx Statis (Production - Hemat RAM)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: hrd_frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

networks:
  global_net:
    external: true
    name: global_network

