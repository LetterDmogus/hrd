services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: hrd_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Redis (Cache & Queue untuk BullMQ)
  redis:
    image: redis:7-alpine
    container_name: hrd_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Backend Fastify
  backend:
    build: ./backend
    container_name: hrd_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 4. Frontend Vue 3
  frontend:
    build: ./frontend
    container_name: hrd_frontend
    restart: always
    ports:
      - "5173:5173"
      - "6006:6006"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: