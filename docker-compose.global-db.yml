services:
  # Container PostgreSQL Utama (Shared Database Server untuk Semua Proyek VPS)
  postgres_global:
    image: postgres:15-alpine
    container_name: global_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_vps_utama_123}
      POSTGRES_DB: postgres # Database default
    ports:
      - "127.0.0.1:5432:5432" # Hanya dapat diakses dari dalam VPS (localhost), aman dari hacker luar
    volumes:
      - global_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  global_postgres_data:
